name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r manuscript/requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Validate manuscript release
        run: python manuscript/scripts/validate_release.py
